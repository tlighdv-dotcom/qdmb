<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="Báo cáo tuyển thành viên mới quân đoàn">
  <title>Thành viên mới</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="public-page">
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <main class="shell">
    <header class="hero glass">
      <div class="hero-copy">
        <span class="eyebrow">QUÂN ĐOÀN</span>
        <h1 id="guildName">CARTOON NETWORK</h1>
        <p id="pageTitle">Báo cáo tuyển thành viên mới</p>
      </div>
      <div class="hero-stat" aria-label="Tổng thành viên mới"><strong id="memberCount">0</strong><span>thành viên mới</span></div>
    </header>
    <section class="toolbar glass" aria-label="Tìm kiếm thành viên">
      <label class="search-box"><span aria-hidden="true">⌕</span><input id="searchInput" type="search" placeholder="Tìm theo tên hoặc ID..." autocomplete="off"></label>
      <div class="live-badge"><i></i> Tự động cập nhật</div>
    </section>
    <div id="statusBox" class="status-box" hidden></div>
    <section id="memberGrid" class="member-grid" aria-live="polite">
      <article class="skeleton card"></article><article class="skeleton card"></article><article class="skeleton card"></article>
    </section>
    <section id="emptyState" class="empty-state glass" hidden><div class="empty-icon">🐻</div><h2>Chưa có thành viên phù hợp</h2><p>Thử từ khóa khác hoặc quay lại sau.</p></section>
    <footer class="footer">Danh sách được đồng bộ trực tiếp từ hệ thống quản lý quân đoàn.</footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script type="module" src="assets/public.js"></script>
</body>
</html>
